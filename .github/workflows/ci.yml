name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit-and-test:
    name: Lint, Test & Build Quality Gate
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    env:
      CI: true
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: "file:./dev.db"
      CLIENT_URL: "http://localhost:5173"
      GEMINI_API_KEY: ""
      SAFEBROWSING_API_KEY: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies & setup workspace
        run: npm run setup

      - name: Apply database migrations & demo seed
        run: |
          npm run db:migrate
          npm run db:seed

      - name: Static Analysis & Linting (oxlint)
        run: npm run lint

      - name: Execute Automated Test Suites (144 Tests)
        run: npm test

      - name: Measure Code Coverage
        run: npm run test:coverage

      - name: Build Production Client & Server
        run: npm run build

      - name: Dependency Security Audit
        run: npm run audit
